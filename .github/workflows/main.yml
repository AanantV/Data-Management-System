name: main

on:
  push:
    branches: [main, feature-stationary]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Check for syntax errors
        run: python -m py_compile Student_Manager.py

      - name: Lint with flake8
        run: flake8 Student_Manager.py --max-line-length=100 --exit-zero
        

